name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Rules self-test
        run: bun test

      - name: GRAIN on itself
        run: bun grain --all

      - name: Level audit
        run: bun grain --audit

      - name: Generated docs are current
        run: |
          bun run docs
          git diff --exit-code -- docs/CARD.md docs/SMALL.md
